name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Unity
      uses: game-ci/unity-setup@v1
      with:
        unityVersion: 2020.3.43f1

    - name: Build Asset Bundles
      run: |
        cd MuffinUp
        /opt/unity/Editor/Unity -batchmode -nographics -executeMethod CreateAssetBundles.BuildAllAssetBundles -quit

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release
    
  
